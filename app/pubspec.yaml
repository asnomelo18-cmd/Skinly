name: skinly
description: "Skinly — suivi de routine skincare avec rappels programmés"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  # L'image a un fond crème clair (pas de transparence), donc pas besoin
  # de background séparé pour l'icône adaptative Android.
  adaptive_icon_background: "#FBF4EE"
  adaptive_icon_foreground: "assets/icon/icon.png"
